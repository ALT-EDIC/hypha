{% load i18n heroicons %}
{# Submits the form from "users/includes/oauth_login_forms.html". #}
<button
    class="btn btn-primary btn-block sm:btn-ultrawide"
    type="submit"
    form="oidc-oauth2-login-form"
>
    {% heroicon_mini "key" size=18 class="opacity-80" aria_hidden=true %}
    {% blocktrans with OIDC_OAUTH2_SERVICE_NAME as service_name %}Authenticate with {{ service_name }}{% endblocktrans %}
</button>
